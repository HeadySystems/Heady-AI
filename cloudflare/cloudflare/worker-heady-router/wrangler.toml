name = "worker-heady-router"
main = "src/index.js"
compatibility_date = "2026-03-06"

# KV Namespace for UI Manifest (compiled UI chunks by domain/path)
[[kv_namespaces]]
binding = "HEADY_UI_MANIFEST"
id = "238f7a3f1c5c4060bfc07dccb78bd1ee"

# Internal auth token for triggering Colab compiler
[vars]
# HEADY_INTERNAL_TOKEN = "set via wrangler secret"

# Route all 9+ Heady domains through this worker
# Configure in Cloudflare Dashboard → Workers Routes:
#   *headymcp.com/*
#   *headysystems.com/*
#   *headyme.com/*
#   *headyapi.com/*
#   *headyio.com/*
#   *headyfinance.com/*
#   *headymusic.com/*
#   *headyconnection.org/*
#   *headyconnection.org/*
#   *myheady-ai.com/*
#   *heady.headyme.com/*

# ═══════════════════════════════════════════════════════════════════
# Premium Edge Services bindings (Graceful degradation supported)
# ═══════════════════════════════════════════════════════════════════

[ai]
binding = "AI"

[[r2_buckets]]
binding = "ASSET_BUCKET"
bucket_name = "heady-edge-assets"
preview_bucket_name = "heady-edge-assets-preview"

[[d1_databases]]
binding = "EDGE_SQL"
database_name = "heady_edge_db"
database_id = "8f24bfa1-cc36-4078-bfdd-b7cc81ab1926"

[[vectorize]]
binding = "EDGE_VECTOR_INDEX"
index_name = "heady-edge-index"

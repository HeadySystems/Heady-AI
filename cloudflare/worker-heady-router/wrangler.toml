name = "worker-heady-router"
main = "src/index.js"
compatibility_date = "2026-03-06"

# KV binding temporarily removed - CF_API_TOKEN needs KV write perms
# [[kv_namespaces]]
# binding = "HEADY_UI_MANIFEST"
# id = "238f7a3f1c5c4060bfc07dccb78bd1ee"

[vars]
HEADY_ORIGIN_BASE = "https://heady-edge-gateway-609590223909.us-central1.run.app"
COLAB_COMPILER_WEBHOOK = "https://heady-edge-gateway-609590223909.us-central1.run.app/api/hologram/compile"

# ═══════════════════════════════════════════════════════════════════
# All Heady domain routes (EXCEPT headymcp.com — owned by headymcp-edge)
# ═══════════════════════════════════════════════════════════════════

# ── AI Platform ──────────────────────────────────────────────────────
[[routes]]
pattern = "heady-ai.com/*"
zone_name = "heady-ai.com"
[[routes]]
pattern = "www.heady-ai.com/*"
zone_name = "heady-ai.com"

# ── Companion ────────────────────────────────────────────────────────
[[routes]]
pattern = "headybuddy.org/*"
zone_name = "headybuddy.org"
[[routes]]
pattern = "www.headybuddy.org/*"
zone_name = "headybuddy.org"

# ── Bot / Automation ─────────────────────────────────────────────────
[[routes]]
pattern = "headybot.com/*"
zone_name = "headybot.com"
[[routes]]
pattern = "www.headybot.com/*"
zone_name = "headybot.com"

# ── API Gateway ──────────────────────────────────────────────────────
[[routes]]
pattern = "headyapi.com/*"
zone_name = "headyapi.com"
[[routes]]
pattern = "www.headyapi.com/*"
zone_name = "headyapi.com"

# ── OS Portal ────────────────────────────────────────────────────────
[[routes]]
pattern = "headyos.com/*"
zone_name = "headyos.com"
[[routes]]
pattern = "www.headyos.com/*"
zone_name = "headyos.com"

# ── Executive Hub ────────────────────────────────────────────────────
[[routes]]
pattern = "headyex.com/*"
zone_name = "headyex.com"
[[routes]]
pattern = "www.headyex.com/*"
zone_name = "headyex.com"

# ── Admin / Auth / Discord Subdomains ────────────────────────────────
# NOTE: manager/ai/api/buddy/mcp/edge/battle/stream/vector subdomains
# are handled by the headysystems.com/* wildcard route below.
# Explicit subdomain routes removed — they conflicted with existing
# Cloudflare worker assignments (deploy error: "routes assigned to another worker").
[[routes]]
pattern = "admin.headysystems.com/*"
zone_name = "headysystems.com"
[[routes]]
pattern = "auth.headysystems.com/*"
zone_name = "headysystems.com"
[[routes]]
pattern = "discord.headysystems.com/*"
zone_name = "headysystems.com"

# ── Cloud Platform ──────────────────────────────────────────────────
[[routes]]
pattern = "headycloud.com/*"
zone_name = "headycloud.com"
[[routes]]
pattern = "www.headycloud.com/*"
zone_name = "headycloud.com"

# ── HeadyAI ──────────────────────────────────────────────────────────
[[routes]]
pattern = "headyai.com/*"
zone_name = "headyai.com"
[[routes]]
pattern = "www.headyai.com/*"
zone_name = "headyai.com"

# ── HeadyConnection ─────────────────────────────────────────────────
[[routes]]
pattern = "headyconnection.org/*"
zone_name = "headyconnection.org"
[[routes]]
pattern = "www.headyconnection.org/*"
zone_name = "headyconnection.org"

# ── HeadyFinance ─────────────────────────────────────────────────────
[[routes]]
pattern = "headyfinance.com/*"
zone_name = "headyfinance.com"
[[routes]]
pattern = "www.headyfinance.com/*"
zone_name = "headyfinance.com"

# ── HeadySystems ─────────────────────────────────────────────────────
[[routes]]
pattern = "headysystems.com/*"
zone_name = "headysystems.com"
[[routes]]
pattern = "www.headysystems.com/*"
zone_name = "headysystems.com"

# ── HeadyMe ─────────────────────────────────────────────────────────
[[routes]]
pattern = "headyme.com/*"
zone_name = "headyme.com"
[[routes]]
pattern = "www.headyme.com/*"
zone_name = "headyme.com"

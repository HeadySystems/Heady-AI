name = "headymcp-com"
main = "src/index.js"
compatibility_date = "2026-03-06"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "headymcp.com/*"
zone_name = "headymcp.com"

# Live origin the edge fronts. Env-derived (AGENTS.md #4 — no hardcoded URLs).
# Per-domain deploys may override this binding; the router fails closed (503) if unset.
[vars]
HEADY_ORIGIN = "https://heady-manager-609590223909.us-central1.run.app"

# The primary route is declared above so production cannot silently remain
# attached to a stale Worker script. www.headymcp.com is intentionally owned by
# headymcp-edge and forwards to the Streamable HTTP Cloud Run service.
# The MCP passthrough (X-Heady-Module: mcp-gateway) is headymcp-specific; other
# Heady domains have their own intended origins and are NOT fronted by this worker
# by default. Deploy per-domain by PUTting this script's code to a script name and
# setting HEADY_ORIGIN for that domain's real origin.

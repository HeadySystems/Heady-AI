# HEADY_BRAND:BEGIN
# ╔══════════════════════════════════════════════════════════════════╗
# ║  Heady Edge Router — DEPRECATED (routes moved to worker-heady-router)
# ║  This worker is kept alive but no longer claims any domain routes.
# ║  All domain routing is handled by worker-heady-router.
# ╚══════════════════════════════════════════════════════════════════╝
# HEADY_BRAND:END

name = "heady-edge-router"
main = "src/index.js"
compatibility_date = "2026-03-01"

# ─── No Production Routes ──────────────────────────────────────────
# All routes have been consolidated into worker-heady-router.
# This worker remains deployed but does not claim any domain routes.
# Keeping it alive prevents accidental 404s if referenced elsewhere.

[env.production]
workers_dev = true

# ─── Environment Variables ──────────────────────────────────────────
[vars]
ORIGIN_URL = "https://heady-liquid-latent-os-849135684797.us-central1.run.app"
NODE_ENV = "production"
HEADY_EDGE_ROUTER_VERSION = "1.0.0-deprecated"

# ─── KV removed (IDs don't exist) ──────────────────────────────────
# KV bindings removed — the KV namespace IDs were placeholders.

# ─── Observability ──────────────────────────────────────────────────
[observability]
enabled = true
head_sampling_rate = 1.0

# ─── Limits ─────────────────────────────────────────────────────────
[limits]
cpu_ms = 50

    - lint
    - typecheck
    - test
    - scan
hcfullpipeline:
  # HCFullPipeline — the autonomous orchestration DAG. Canonical = 22 stages (0–21),
  # CHANNEL_ENTRY → … → RECEIPT (order 20, terminal accounting) → DISTILL (order 21,
  # terminal stage). Authority: ADR-0040 (founder re-ruling 2026-08-04), superseding the
  # prior 21-stage canon (fib(8) anchor consciously dropped for the stage count — shape
  # follows function; φ still governs timeouts/backoff/TTLs per LAW-10). Matches the shipped
  # production DAG (headyai/heady-production configs/hcfullpipeline.yaml v8.0.0, terminal
  # distiller). Variants select subsets (Fast/EXPRESS, FULL, ARENA, LEARNING); only LEARNING
  # and FULL include DISTILL by default. Any prose/skill asserting "N-stage HCFullPipeline"
  # or "HCFP — N Stages" is checked against this by the coherence gate.
  stage_count: 22
consistency:
  escalation_threshold: 3
stage0:
  # Agent-untouchable bootstrap (rustc-style Stage 0) — the verifier-of-verifiers.
  # The future coder-agent (STEPWISE 3.19/3.24, Phase 3) can NEVER edit these,
  # regardless of eval pass-rate. Path-glob SoT + CODEOWNERS lock; enforced live by
  # tooling/coherence (STAGE0-* checks). Authority: ADR-0016 + STEPWISE §0.8.
  manifest: configs/stage0-untouchables.json

context7:
  enabled: true
  transport: streamable-http
  endpoint: https://mcp.context7.com/mcp
  namespace: context7
  version: "1.0.0"

  # ── Sacred Geometry Placement ──────────────────────────────────────────────
  sacred_geometry:
    layer: Outer          # Specialist ring — external integration
    node: BRIDGE          # Bridge node — external service adapter
    pool: Warm            # 21% — background processing allocation

  # ── LRU Cache Configuration ───────────────────────────────────────────────
  cache:
    library_ids:
      max_size: 89        # FIB[10]
      ttl_ms: 377000      # FIB[14] * 1000 ≈ 6.28 minutes
    docs:
      max_size: 21        # FIB[8]
      ttl_ms: 233000      # FIB[12] * 1000 ≈ 3.88 minutes

  # ── Circuit Breaker (phi-backoff) ─────────────────────────────────────────
  circuit_breaker:
    max_failures: 8       # FIB[6]
    reset_timeout_ms: 55000  # FIB[9] * 1000
    half_open_max: 3      # FIB[4]
    backoff_base_ms: 800  # FIB[6] * 100
    backoff_max_ms: 8900  # FIB[10] * 100
    max_attempts: 8       # FIB[6]

  # ── Rate Limiting ─────────────────────────────────────────────────────────
  rate_limit:
    requests_per_minute: 89   # FIB[10] — Context7 Pro limits
    burst: 13                 # FIB[7]

  # ── Pipeline Integration ──────────────────────────────────────────────────
  pipeline:
    max_tokens_per_run: 98700     # FIB[15] * 100
    max_tokens_per_lib: 14400     # FIB[11] * 100
    max_libraries_per_task: 13    # FIB[7]
    enrichment_threshold: 0.809   # CSL_GATES.MEDIUM

  # ── Bee Configuration ─────────────────────────────────────────────────────
  bee:
    domain: context7
    swarm: research
    tier: high
    layer: Outer
    node: BRIDGE
    priority_weight: 0.618        # PSI — golden ratio conjugate
    template_id: context7-doc-resolver
    heartbeat_interval_ms: 55000  # FIB[9] * 1000
    retire_drain_ms: 55000        # FIB[9] * 1000
    embedding_dim: 384

  # ── Service Configuration ─────────────────────────────────────────────────
  service:
    port: 3371
    host: "0.0.0.0"
    cors_origins:
      - "*.headysystems.com"
      - "localhost:3371"

  # ── Health Check ──────────────────────────────────────────────────────────
  health:
    probe_library: "express"      # Known-good library for health pings
    coherence_floor: 0.809        # CSL_GATES.MEDIUM
    check_interval_ms: 55000      # FIB[9] * 1000

  # ── Logging ───────────────────────────────────────────────────────────────
  logging:
    level: info
    format: json
    component: context7

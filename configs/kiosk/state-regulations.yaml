# HEADY_BRAND:END

version: "1.0.0"
description: >
  Per-state compliance rules for age-restricted product dispensing kiosks.
  Each state defines accepted ID types, age thresholds, verification levels,
  purchase limits, operating hours, and seed-to-sale tracking requirements.

# ─── DEFAULT RULES (federal baseline) ────────────────────────────────────────
defaults:
  age_threshold: 21
  accepted_ids:
    - drivers_license
    - state_id
    - passport
    - passport_card
    - military_id
    - tribal_id
  rejected_ids:
    - expired
    - photocopied
    - digital_screenshot
    - foreign_non_passport
  verification_level: STANDARD        # BASIC | STANDARD | ENHANCED
  requires_staff_supervision: true     # Most states require this
  data_retention_days: 0               # Default: purge immediately (data minimization)
  audit_log_retention_years: 3
  operating_hours:
    start: "08:00"
    end: "22:00"
  purchase_limits:
    enabled: false
  seed_to_sale_system: null

# ─── STATE-SPECIFIC OVERRIDES ────────────────────────────────────────────────
states:
  # ─── Colorado ────────────────────────────────────────────────────────────
  CO:
    name: Colorado
    cannabis_legal: true
    cannabis_type: recreational_and_medical
    age_threshold_recreational: 21
    age_threshold_medical: 18
    verification_level: STANDARD
    requires_staff_supervision: true
    requires_electronic_id_scan: false   # Allowed but not mandated
    seed_to_sale_system: METRC
    seed_to_sale_api: "https://api-co.metrc.com"
    purchase_limits:
      enabled: true
      recreational:
        flower_oz: 1.0
        concentrate_g: 8
        edible_mg_thc: 800
      medical:
        flower_oz: 2.0
        concentrate_g: 40
        edible_mg_thc: 20000
    operating_hours:
      start: "08:00"
      end: "00:00"
    audit_log_retention_years: 5
    notes: >
      Colorado Marijuana Enforcement Division (MED) requires all sales
      to be logged in METRC. Automated kiosks must operate within a
      licensed dispensary premises with staff supervision.

  # ─── California ──────────────────────────────────────────────────────────
  CA:
    name: California
    cannabis_legal: true
    cannabis_type: recreational_and_medical
    age_threshold_recreational: 21
    age_threshold_medical: 18
    verification_level: STANDARD
    requires_staff_supervision: true
    requires_electronic_id_scan: false
    seed_to_sale_system: METRC
    seed_to_sale_api: "https://api-ca.metrc.com"
    purchase_limits:
      enabled: true
      recreational:
        flower_oz: 1.0
        concentrate_g: 8
        edible_mg_thc: 1000
    operating_hours:
      start: "06:00"
      end: "22:00"
    biometric_law: CCPA
    biometric_rules:
      consent_required: true
      must_disclose_collection: true
      must_allow_deletion: true
      retention_max_days: 0             # Purge immediately after verification
    audit_log_retention_years: 7
    notes: >
      CCPA applies to all biometric data. No face data may be retained
      beyond the verification transaction. BCC (Bureau of Cannabis Control)
      enforces via METRC.

  # ─── Illinois ────────────────────────────────────────────────────────────
  IL:
    name: Illinois
    cannabis_legal: true
    cannabis_type: recreational_and_medical
    age_threshold_recreational: 21
    age_threshold_medical: 18
    verification_level: ENHANCED         # Electronic scan mandated
    requires_staff_supervision: true
    requires_electronic_id_scan: true    # Mandated by state law
    seed_to_sale_system: BioTrack
    seed_to_sale_api: "https://api.biotrack.com/il"
    purchase_limits:
      enabled: true
      recreational_resident:
        flower_g: 30
        concentrate_g: 5
        edible_mg_thc: 500
      recreational_non_resident:
        flower_g: 15
        concentrate_g: 2.5
        edible_mg_thc: 250
    biometric_law: BIPA
    biometric_rules:
      written_consent_required: true
      must_disclose_purpose: true
      retention_max_days: 0
      private_right_of_action: true     # Users can sue — strictest law in US
      statutory_damages_per_violation: 5000
    audit_log_retention_years: 5
    notes: >
      BIPA (Biometric Information Privacy Act) is the strictest biometric
      law in the US. NO face embeddings may be stored. Written consent
      MUST be obtained before any biometric scan. Violations carry $5,000
      per-incident statutory damages.

  # ─── Michigan ────────────────────────────────────────────────────────────
  MI:
    name: Michigan
    cannabis_legal: true
    cannabis_type: recreational_and_medical
    age_threshold_recreational: 21
    age_threshold_medical: 18
    verification_level: STANDARD
    requires_staff_supervision: true
    requires_electronic_id_scan: false
    seed_to_sale_system: METRC
    seed_to_sale_api: "https://api-mi.metrc.com"
    purchase_limits:
      enabled: true
      recreational:
        flower_oz: 2.5
        concentrate_g: 15
        edible_mg_thc: 1600
    audit_log_retention_years: 4
    notes: >
      Michigan Cannabis Regulatory Agency (CRA) uses METRC.
      Dispensaries may operate self-service kiosks within
      the licensed premises under staff supervision.

  # ─── Nevada ──────────────────────────────────────────────────────────────
  NV:
    name: Nevada
    cannabis_legal: true
    cannabis_type: recreational_and_medical
    age_threshold_recreational: 21
    age_threshold_medical: 18
    verification_level: ENHANCED
    requires_staff_supervision: true
    requires_electronic_id_scan: true
    seed_to_sale_system: METRC
    seed_to_sale_api: "https://api-nv.metrc.com"
    purchase_limits:
      enabled: true
      recreational:
        flower_oz: 1.0
        concentrate_g: 3.5
    operating_hours:
      start: "00:00"
      end: "24:00"                      # 24-hour sales allowed in some jurisdictions
    audit_log_retention_years: 5

# ─── HEMP / THCA (Less Regulated — Faster Path to Market) ───────────────────
hemp_derived:
  description: >
    Hemp-derived products (THCA, Delta-8, Delta-10) are generally regulated
    under the 2018 Farm Bill at the federal level and may have lighter
    state-level kiosk requirements. This is the recommended first market.
  federal_age_threshold: 21             # Industry standard, not always mandated
  verification_level: BASIC
  requires_staff_supervision: false     # Many states allow unattended
  seed_to_sale_required: false
  states_allowing_unattended_kiosks:
    - TX
    - FL
    - GA
    - NC
    - OH
    - TN
    - VA
    - MO

# ─── ALCOHOL ────────────────────────────────────────────────────────────────
alcohol:
  federal_age_threshold: 21
  verification_level: STANDARD
  requires_staff_supervision: true       # Most states require for alcohol
  notes: >
    Alcohol vending is regulated by individual state ABC (Alcoholic Beverage
    Control) boards. Very few states allow unattended alcohol vending.

# ─── TOBACCO / NICOTINE ────────────────────────────────────────────────────
tobacco:
  federal_age_threshold: 21             # Raised to 21 in 2019 (Tobacco 21)
  verification_level: BASIC
  requires_staff_supervision: false     # Some states allow tobacco vending machines
  fda_pmta_required: true               # For e-cigarettes/vapes

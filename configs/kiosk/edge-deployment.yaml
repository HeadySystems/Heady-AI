version: "1.0.0"
description: >
  Edge deployment configuration for HeadyKiosk cannabis dispensary
  terminals. Each kiosk runs as a self-contained Liquid Node with
  offline-capable identity verification, local AI inference, and
  cloud sync when connected.

# ─── KIOSK LIQUID NODE CONTRACT ──────────────────────────────────────────────
kiosk_node:
  serviceId: heady-kiosk
  serviceVersion: "1.0.0"
  serviceTier: edge
  port: 3380
  liquid_node: true

  # Hardware requirements per kiosk unit
  hardware:
    display:
      type: touchscreen
      min_size_inches: 15
      resolution: "1920x1080"
      orientation: portrait
    camera:
      type: RGB
      min_resolution: "1280x720"
      recommended: "1920x1080"
      position: top_center
      ir_depth_sensor: optional         # Enhanced liveness detection
    id_scanner:
      type: document_scanner
      supported_formats:
        - PDF417_barcode                 # US driver's licenses
        - MRZ                            # Passports
        - NFC_chip                       # ePassports (future)
      vendors:
        - SocketMobile
        - Honeywell
        - IDScan.net
    payment_terminal:
      types:
        - cash_acceptor                  # Cannabis industry primary
        - debit_pin_debit                # Where banking allows
        - crypto_btc_ltc                 # Decentralized option
        # Note: Most major credit card processors prohibit cannabis
      vendors:
        - CashCode
        - PayNearMe
        - CanPay
    dispenser:
      type: automated_locker
      capacity_slots: 48                 # Standard kiosk locker count
      lock_mechanism: electronic_solenoid
      sensor: infrared_product_detect

  # Runtime environment
  runtime:
    platform: electron
    node_version: "20.x"
    os: "Ubuntu 22.04 LTS"
    mode: kiosk                          # Fullscreen, no URL bar, no dev tools
    auto_start: true
    watchdog_restart: true
    crash_recovery: true

# ─── OFFLINE CAPABILITIES ────────────────────────────────────────────────────
offline:
  description: >
    Cannabis kiosks MUST operate during internet outages.
    Core verification runs entirely on-device.
  capabilities:
    id_scanning: full                    # PDF417/MRZ parsing is local
    age_verification: full               # Date calculation is local
    face_verification: full              # On-device ML inference
    compliance_checks: full              # Regulations cached locally
    product_catalog: cached              # Last-synced catalog
    payment_cash: full                   # Cash acceptor is local
    payment_digital: degraded            # Requires connectivity
    seed_to_sale_reporting: queued       # Buffered until reconnect
    audit_logging: full                  # Logged locally, synced later

  local_models:
    face_detection:
      model: blazeface
      format: tflite
      size_mb: 0.4
      inference_ms: 15
    face_embedding:
      model: arcface_mobilenet
      format: onnx
      size_mb: 12
      inference_ms: 45
    liveness_detection:
      model: minifasnet
      format: onnx
      size_mb: 8
      inference_ms: 30
    id_ocr:
      model: tesseract_wasm
      format: wasm
      size_mb: 5
      inference_ms: 200

  sync_queue:
    max_queued_transactions: 500
    sync_on_reconnect: true
    priority_order:
      - audit_logs
      - seed_to_sale_reports
      - inventory_decrements
      - telemetry

# ─── CLOUD SYNC ──────────────────────────────────────────────────────────────
cloud_sync:
  provider: heady-cloud
  conductor_endpoint: https://api.headysystems.com/conductor
  event_spine:
    topic: "heady:kiosk-events"
    consumer_group: "kiosk-consumers"
  sync_intervals:
    product_catalog_ms: 300000           # 5 minutes
    regulations_ms: 86400000             # 24 hours
    model_updates_ms: 604800000          # 7 days
    telemetry_ms: 60000                  # 1 minute
  data_flows:
    inbound:
      - product_catalog_updates
      - pricing_changes
      - regulation_updates
      - model_weight_updates
      - system_commands
    outbound:
      - transaction_records
      - audit_logs
      - inventory_changes
      - health_telemetry
      - verification_stats

# ─── FLEET MANAGEMENT ────────────────────────────────────────────────────────
fleet:
  description: >
    HeadyConductor manages all kiosks as edge Liquid Nodes.
    Each kiosk reports health via EventSpine, receives commands,
    and can be remotely configured, updated, or locked.
  management:
    remote_config: true
    remote_lock: true                    # Lock kiosk remotely (theft/compliance)
    remote_reboot: true
    ota_updates: true                    # Over-the-air software updates
    remote_diagnostics: true             # Run CSSD remotely
  health_reporting:
    interval_ms: 29034                   # φ⁷ × 1000
    metrics:
      - hardware_status
      - camera_health
      - scanner_health
      - dispenser_status
      - cash_acceptor_level
      - network_connectivity
      - cpu_temperature
      - storage_free_gb
      - daily_transaction_count
      - verification_success_rate
  alerts:
    - condition: camera_health != healthy
      severity: critical
      action: lock_kiosk_and_notify
    - condition: cash_acceptor_level > 90%
      severity: warning
      action: notify_dispensary_staff
    - condition: storage_free_gb < 2
      severity: warning
      action: purge_old_telemetry
    - condition: verification_success_rate < 0.80
      severity: warning
      action: run_cssd_diagnostic

# ─── PHYSICAL SECURITY ──────────────────────────────────────────────────────
physical_security:
  tamper_detection:
    case_open_sensor: true
    camera_cover_detector: true
    scanner_disconnect_alert: true
    usb_port_lockdown: true
    network_cable_monitor: true
  response:
    on_tamper_detected:
      - lock_kiosk_immediately
      - sound_alarm
      - capture_camera_frame
      - notify_dispensary_manager
      - notify_heady_security_ops
      - log_incident_to_audit
  encryption:
    disk: luks2
    memory: encrypted_swap
    network: tls_1_3_mutual
    audit_logs: aes_256_gcm

# Heady Canonical Site Registry — local site processes (PM2 / ports / dirs)
# 24 web properties total
# Domain canon SoT: facts.yaml `domains:` (repo root) — this file must stay
# consistent with it and is authoritative ONLY for process/port/dir layout.
# Last audited: 2026-02-25 01:48 MST · Domain canon reconciled: 2026-07-04

sites:
  # ── Primary Branded Domains (8 public domains) ──
  - id: headysystems
    domain: headysystems.com
    port: 9000
    pm2: site-headysystems
    purpose: "Platform operations homepage"
    dir: /home/headyme/sites/headysystems

  - id: headyme
    domain: headyme.com
    port: 9001

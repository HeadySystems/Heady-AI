  # ── Internal/Secondary Sites ──
  - id: headyweb
    domain: null
    port: 3000
    pm2: site-headyweb
    purpose: "HeadyWeb AI search engine"
    dir: /home/headyme/sites/headyweb

  - id: admin-ui
    domain: null
    port: 9008
    pm2: site-admin-ui
    purpose: "Internal admin dashboard"
    dir: /home/headyme/sites/admin-ui

  - id: headydocs
    domain: null

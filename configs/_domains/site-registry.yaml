    purpose: "Personal AI command center"
    dir: /home/headyme/sites/headyme-com

  - id: headyconnection
    domain: headyconnection.org
    port: 9002
    pm2: site-headyconnection-org
    purpose: "Nonprofit AI for social impact"
    dir: /home/headyme/sites/headyconnection-org

  - id: headybuddy
    domain: headybuddy.org
    port: 9003
    pm2: site-headybuddy-org
    purpose: "Personal AI assistant & guide"
    dir: /home/headyme/sites/headybuddy-org

  - id: headymcp
    domain: headymcp.com
    port: 9004
    pm2: site-headymcp
    purpose: "MCP protocol hub & marketplace"
    dir: /home/headyme/sites/headymcp

  - id: headyio
    domain: headyio.com
    port: 9005
    pm2: site-headyio

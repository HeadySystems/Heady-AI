    dir: /home/headyme/sites/headydocs

  - id: instant
    domain: null
    port: 9010
    pm2: site-instant
    purpose: "Instant preview/demo"
    dir: /home/headyme/sites/instant

  # 1ime1.com root serves apps/headyme-portal via Firebase Hosting (project
  # heady-ai) — see docs/runbooks/1IME1_ADMIN_SURFACE_RUNBOOK.md. The local
  # process/port below is reserved for tasks.1ime1.com (Drupal task-manager).
  - id: 1ime1
    domain: 1ime1.com
    port: 9011
    pm2: site-1ime1
    purpose: "Heady admin surface (headyme-portal)"
    dir: /home/headyme/sites/1ime1

  # ── Duplicate/Alias Processes (serve same content on different ports) ──
  - id: headysystems-com
    alias_of: headysystems
    pm2: site-headysystems-com
    dir: /home/headyme/sites/headysystems-com

  - id: headyio-com
    alias_of: headyio
    pm2: site-headyio-com
    dir: /home/headyme/sites/headyio-com

  - id: headyconnection-orig
    alias_of: headyconnection
    pm2: site-headyconnection
    dir: /home/headyme/sites/headyconnection

  - id: headybuddy-orig
    alias_of: headybuddy
    pm2: site-headybuddy
    dir: /home/headyme/sites/headybuddy

  - id: headymcp-com
    alias_of: headymcp
    pm2: site-headymcp-com
    dir: /home/headyme/sites/headymcp-com

  - id: headyme-orig
    alias_of: headyme
    pm2: site-headyme
    dir: /home/headyme/sites/headyme

  # ── Discord Bots ──
  - id: heady-discord
    pm2: site-heady-discord
    purpose: "Discord bot"
    dir: /home/headyme/sites/heady-discord

  - id: heady-discord-connection
    pm2: site-heady-discord-connection
    purpose: "Discord HeadyConnection bot"
    dir: /home/headyme/sites/heady-discord-connection

  # ── HuggingFace Spaces (3) ──
  - id: hf-brain-demo
    url: https://huggingface.co/spaces/HeadyMe/heady-ai
    dir: heady-hf-spaces/main
    deploy_script: scripts/deploy-hf-spaces.js

  - id: hf-systems
    url: https://huggingface.co/spaces/HeadySystems/heady-systems
    dir: heady-hf-spaces/systems
    deploy_script: scripts/deploy-hf-spaces.js

  - id: hf-connection
    url: https://huggingface.co/spaces/HeadyConnection/heady-connection
    dir: heady-hf-spaces/connection
    deploy_script: scripts/deploy-hf-spaces.js


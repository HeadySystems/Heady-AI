# ╔══════════════════════════════════════════════════════════════════╗
# ║  HEADY™ Service Provider Registry — the single source of truth for ║
# ║  every external service the org pays for or depends on.            ║
# ║  Curated SoT (this file) + auto-discovery (Gmail "Subscription     ║
# ║  Radar") reconcile against each other — a charge with no entry, or ║
# ║  an entry with no recent charge, is a coherence finding.           ║
# ║  Cross-links packages/secrets/src/registry.mjs via `secrets:`.     ║
# ║  © 2026 HeadySystems Inc. — Eric Haywood, Founder                  ║
# ╚══════════════════════════════════════════════════════════════════╝
#
# NO SECRET VALUES here — only the secret NAMES each provider consumes (the values
# live in GCP Secret Manager / the secrets registry). `status` and `cost` are seeded
# from a 2026-06-18 Gmail scan and are advisory until the Radar reconciler verifies them.
#
# schema:
#   id           kebab-case unique key
#   category     db | cloud | edge | ai | hosting | productivity | comms | vcs | analytics | payments | secrets
#   entity       which legal entity pays (HeadySystems = for-profit · HeadyConnection = 501c3)
#   plan         human label
#   cost         { amount, currency, cadence }   (null where unknown)
#   status       active | failing | suspended | canceled | trial | exposed | unknown
#   criticality  production | useful | trial | cancel-candidate
#   secrets      [SECRET_NAME...] cross-ref to packages/secrets/src/registry.mjs
#   discount     { program, state }              (nonprofit etc.)
#   notes        free text

schema: service-providers.v1
generated_from: gmail-scan-2026-06-18
reconciler: tooling/service-registry  # (to build) — verifies this against the Subscription Radar

# ─── SECURITY INCIDENT (open) ───────────────────────────────────────
security_incidents:
  - id: SEC-002-neon-public-exposure
    opened: 2026-06-17
    severity: critical
    summary: >
      Live PRODUCTION Neon connection string (neondb_owner@ep-cold-snow-aesmiwt9...us-east-2)
      hardcoded in HeadySystems/Heady-Main/.github/workflows/fix-gcp-secrets.yml on a PUBLIC
      repo since ~2026-04-05. Detected by GitHub secret-scanning → Neon alert (Jun 17 + Jun 19).
    blast_radius: "13 public org repos; 30 secret-scanning alerts on Heady-Main alone"
    assume_compromised: true   # public ~10 weeks → assume the DB password was readable by anyone
    remediation:
      - "ROTATE Neon password NOW (console → project → Connect → Reset password) — human-gated, destructive to live app"
      - "Audit Neon/Databricks access logs for unauthorized connections during exposure window"
      - "Make legacy mirror repos PRIVATE or delete (Heady-Main/Testing/Staging/Ecosystem/sandbox...)"
      - "Enable GitHub push protection + secret scanning (blocks future inline-secret commits)"
      - "Triage the other 29 Heady-Main alerts + sweep the remaining 12 public repos"
      - "Replace inline secrets in workflows with ${{ secrets.* }} references"
    related: [SEC-001, sec-001-containment, colab-neon-live-key]


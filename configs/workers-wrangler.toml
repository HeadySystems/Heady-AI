# Cloudflare Workers Configuration - Heady Edge Proxy
# Active production routing lives in cloudflare/wrangler.toml. This config
# remains the deployable edge-proxy profile for service-binding workloads.

name = "heady-edge-proxy"
main = "src/index.js"
compatibility_date = "2026-03-01"
account_id = "8b1fa38f282c691423c6399247d53323"

[[kv_namespaces]]
binding = "HEADY_CACHE"
id = "863390221ffe425fab1a8d7d873e1d13"

[[r2_buckets]]
binding = "HEADY_STORAGE"
bucket_name = "heady-assets"

[[d1_databases]]
binding = "HEADY_DB"
database_name = "heady-production"
database_id = "04790c6f-fa1f-4338-aae2-5ffb3c34e95b"

[[services]]
binding = "HEADY_MANAGER"
service = "heady-manager-service"
environment = "production"

[[services]]
binding = "HEADY_MCP"
service = "heady-mcp-service"
environment = "production"

[[durable_objects.bindings]]
name = "HEADY_ORCHESTRATOR"
class_name = "HeadyOrchestrator"
script_name = "heady-orchestrator"

[[queues.producers]]
binding = "HEADY_TASKS"
queue = "heady-background-tasks"

[[queues.consumers]]
queue = "heady-background-tasks"
max_batch_size = 10
max_batch_timeout = 30

[[analytics_engine_datasets]]
binding = "HEADY_ANALYTICS"

[vars]
ENVIRONMENT = "production"
LOG_LEVEL = "info"
PHI_RATIO = "1.618033988749895"
DEFAULT_ORIGIN = "https://heady-edge-gateway-609590223909.us-central1.run.app"

[env.staging.vars]
ENVIRONMENT = "staging"
LOG_LEVEL = "debug"
PHI_RATIO = "1.618033988749895"

[limits]
cpu_ms = 50

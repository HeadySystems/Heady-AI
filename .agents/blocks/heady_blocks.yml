version: "1.0"
# Blocks.team Configuration Matrix for Heady Ecosystem
# These agents embed directly into GitHub, Slack, and Linear using "Heady" environment keys.

workflows:
  - name: "Sentry Medic Auto-Fixer"
    trigger: 
      type: "slack_webhook"
      channel: "#alerts-sentry"
    agent: "blocks-sentry-medic"
    description: "Traces Sentry exceptions back to original source code entirely autonomously."
    envs:
      - PERPLEXITY_API_KEY: "${PERPLEXITY_API_KEY}"
      - SENTRY_AUTH_TOKEN: "${SENTRY_AUTH_TOKEN}"
      - GITHUB_TOKEN: "${HEADY_GITHUB_PAT}"
    instructions: |
      You are the Sentry Medic for the Heady Ecosystem. 
      When a Sentry webhook fires in Slack:
      1. Use the Perplexity API to research deep structural patterns regarding the specific exception type.
      2. Clone the Heady connection repo.
      3. Author the fix in Typescript.
      4. Auto-commit and open a Pull Request against `main`. 

  - name: "Linear Exec AI"
    trigger:
      type: "linear_webhook"
      state: "In Progress"
      assignee: "@blocks"
    agent: "blocks-linear-exec"
    envs:
      - LINEAR_API_KEY: "${LINEAR_API_KEY}"
      - PERPLEXITY_API_KEY: "${PERPLEXITY_API_KEY}"
      - GITHUB_TOKEN: "${HEADY_GITHUB_PAT}"
    instructions: |
      You are the Heady Linear executor. 
      When assigned a ticket:
      1. Parse the Acceptance Criteria.
      2. Use Perplexity to look up optimal implementations if you hit a framework blocker.
      3. Write the necessary React/Next.js/Node code.
      4. Pull Request the code tagged with the Linear issue ID.

skills:
  - name: "Sonar Deep Researcher"
    description: "Allows any Blocks agent to perform structural deep research via the Perplexity Sonar API."
    envs:
      - PERPLEXITY_API_KEY: "${PERPLEXITY_API_KEY}"
    action: |
      // Scripted skill block
      async function runDeepResearch(query) {
        const response = await fetch('https://api.perplexity.ai/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${process.env.PERPLEXITY_API_KEY}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: 'sonar-pro',
            messages: [{ role: 'user', content: query }],
            max_tokens: 4000
          })
        });
        return await response.json();
      }

  - name: "Heady CSL (Continuous Semantic Logic) Gating"
    description: "Validates code changes against the Heady LAW-07 metrics."
    action: |
      // CSL skill implementation
      function validateCSL(codeString) {
        const hasLogging = codeString.includes("logger.info") || codeString.includes("Sentry.captureException");
        const hasTelemetry = codeString.includes("OTEL");
        return {
          compliant: hasLogging && hasTelemetry,
          message: hasLogging ? "Ready for Edge" : "Missing Heady Telemetry SDKs"
        };
      }

  - name: "Heady Project Context Awareness"
    description: "Enables agents to query the HeadyAutoContext engine for real-time resonance, drift, and telemetry metrics."
    action: |
      async function getProjectContext(taskId, query) {
        // Bridges to src/core/auto-context/context-assembler.js
        const { HeadyAutoContext } = await import('../../src/core/auto-context/context-assembler.js');
        const assembler = new HeadyAutoContext();
        const envelope = await assembler.assemble({ 
          taskId: taskId || 'blocks-execution-' + Date.now(),
          userId: 'blocks-agent',
          query: query || 'Analyze project state for autonomous execution'
        });
        return envelope.toJSON();
      }

  - name: "Edge cold-boot optimizer"
    description: "Injects Next.js edge runtimes safely."
    action: |
      function enforceEdgeRuntime(fileContent) {
        if (!fileContent.includes("export const runtime = 'edge';") && !fileContent.includes("prisma")) {
           return "export const runtime = 'edge';\n" + fileContent;
        }
        return fileContent;
      }

  - name: "Service Provider Auditor"
    description: "Audits Cloudflare, GCP, and Vercel utilization for the current context."
    action: |
      async function auditProviders() {
        const { execSync } = await import('child_process');
        // Run the deep-audit script (to be created)
        try {
          const report = execSync('node scripts/deep-audit.mjs --report-only', { encoding: 'utf8' });
          return JSON.parse(report);
        } catch (e) {
          return { error: 'Audit failed', detail: e.message };
        }
      }

  - name: "Vercel Deployment Optimizer"
    description: "Optimizes vercel.json for edge performance and cold-boot reduction."
    action: |
      function optimizeVercelConfig(config) {
        config.framework = config.framework || 'nextjs';
        config.functions = config.functions || {};
        config.functions['api/**/*'] = { runtime: 'edge' };
        return config;
      }

# Default Global Instructions for all Blocks
global_instructions: |
  Before executing any task:
  1. CALL 'Heady Project Context Awareness' to fetch the current Resonance and Drift metrics.
  2. If the task involves external deployment, CALL 'Service Provider Auditor' to verify provider health.
  3. If CSL resonance is below 0.809 (PSI²), pause and perform a 'Sonar Deep Research' on the failure mode.
  4. Ensure all authored code includes Heady-native telemetry (logger.info/Sentry).
  5. Always respect the φ-scaled timing invariants for service calls.

name: "Setup Heady"
description: "Standardizes Node 22 LTS and PNPM 10.6.0 across all Heady pipelines"
runs:
  using: "composite"
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.6.0
    - name: Setup Node 22 LTS
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'pnpm'

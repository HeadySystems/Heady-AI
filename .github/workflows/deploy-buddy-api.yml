name: Deploy Heady Buddy API

on:
  push:
    branches: [main]
    paths:
      - 'services/heady-buddy-api/**'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE: heady-buddy-api
  IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/heady/heady-buddy-api

jobs:
  build-and-deploy:
    name: 'Build & Deploy Buddy API'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build Docker image
        working-directory: services/heady-buddy-api
        run: docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .

      - name: Push Docker image
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --image "$IMAGE:${{ github.sha }}" \
            --region $REGION \
            --min-instances=1 \
            --max-instances=13 \
            --memory=1Gi \
            --cpu=1 \
            --port=3002 \
            --concurrency=150 \
            --timeout=60s \
            --allow-unauthenticated \
            --set-env-vars="NODE_ENV=production,HEADY_VERSION=${{ github.sha }}" \
            --set-secrets="GEMINI_API_KEY=gemini-api-key:latest,CF_ACCOUNT_ID=cf-account-id:latest,CF_API_TOKEN=cf-api-token:latest,HF_TOKEN=hf-token:latest,NEON_DATABASE_URL=neon-database-url:latest,UPSTASH_REDIS_URL=upstash-redis-url:latest,UPSTASH_REDIS_TOKEN=upstash-redis-token:latest" \
            --set-env-vars="CORS_ORIGINS=https://headyme.com,https://headysystems.com,https://headyconnection.org,https://headybuddy.org,https://headymcp.com,https://headyio.com,https://headybot.com,https://headyapi.com,https://headyai.com,https://api.headysystems.com"

      - name: Get service URL
        run: |
          URL=$(gcloud run services describe $SERVICE --region=$REGION --format='value(status.url)')
          echo "Buddy API deployed to: $URL"

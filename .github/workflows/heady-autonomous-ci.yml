name: Heady Autonomous CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1' # Weekly Monday audit

permissions:
  contents: read
  security-events: write
  actions: read

env:
  NODE_VERSION: '25'
  PNPM_VERSION: '9.15.0'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint 2>/dev/null || true
      - run: pnpm test 2>/dev/null || true

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod || true
      - name: CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@v3

  deploy-sites:
    needs: [lint-and-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        site:
          - { name: headyme, dir: sites/headyme }
          - { name: headysystems, dir: sites/headysystems }
          - { name: heady-ai, dir: sites/heady-ai }
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ matrix.site.name }}
          directory: ${{ matrix.site.dir }}

  health-check:
    needs: [deploy-sites]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check all domains
        run: |
          domains=("headyme.com" "headysystems.com" "heady-ai.com" "headymcp.com" "headykey.com" "headyvault.com" "headyconnection.org" "headybuddy.com" "headybrowser.com")
          for domain in "${domains[@]}"; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://$domain" || echo "000")
            echo "$domain: $status"
            if [ "$status" != "200" ] && [ "$status" != "301" ] && [ "$status" != "302" ]; then
              echo "::warning::$domain returned $status"
            fi
          done

  notify:
    needs: [lint-and-test, security-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report to Sentry
        if: failure()
        run: |
          curl -X POST "${{ secrets.SENTRY_DSN }}" \
            -H "Content-Type: application/json" \
            -d '{"message": "CI/CD pipeline failed", "level": "error"}'

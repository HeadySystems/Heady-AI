# ╔══════════════════════════════════════════════════════════════════╗
# ║  HEADY™ CI — single-source derive gate                            ║
# ║  Every <!--heady:inject KEY--> managed region must match the golden ║
# ║  record (facts.yaml/lexicon.yaml). Fail-closed on any hand-edited   ║
# ║  drift — the lock that makes the "60-vs-51 patents" / "8-vs-21      ║
# ║  stages" class of drift impossible. © 2026 HeadySystems — E. Haywood║
# ╚══════════════════════════════════════════════════════════════════╝
name: derive-gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derive:
    name: managed-region freshness + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - name: install
        run: pnpm install --frozen-lockfile
      # Fail-closed if any managed region diverges from facts.yaml/lexicon.yaml.
      - name: derive check
        run: node tooling/heady-derive/src/derive.mjs check
      - name: derive tests
        run: node --test tooling/heady-derive/test/derive.test.mjs

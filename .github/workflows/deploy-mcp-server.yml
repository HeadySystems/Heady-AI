name: Deploy Heady MCP Server

on:
  push:
    branches: [main]
    paths:
      - 'services/heady-mcp-server/**'
  workflow_dispatch:
  workflow_call:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE: heady-mcp-server

jobs:
  build-and-deploy:
    name: 'Build & Deploy MCP Server'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        working-directory: services/heady-mcp-server
        run: |
          cat > /tmp/env.yaml << 'ENVEOF'
          NODE_ENV: production
          HEADY_VERSION: "${{ github.sha }}"
          HEADY_SERVICE: heady-mcp-server
          CORS_ORIGINS: "https://headyme.com,https://headysystems.com,https://headyconnection.org,https://headybuddy.org,https://headymcp.com,https://headyio.com,https://headybot.com,https://headyapi.com,https://headyai.com"
          ENVEOF
          gcloud run deploy $SERVICE \
            --source . \
            --region $REGION \
            --min-instances=0 \
            --max-instances=8 \
            --memory=512Mi \
            --cpu=1 \
            --port=3003 \
            --concurrency=100 \
            --timeout=60s \
            --allow-unauthenticated \
            --env-vars-file=/tmp/env.yaml

      - name: Get service URL
        run: |
          URL=$(gcloud run services describe $SERVICE --region=$REGION --format='value(status.url)')
          echo "MCP server deployed to: $URL"

name: Deploy Edge Proxy Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/edge-proxy/**'
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

jobs:
  deploy:
    name: Deploy heady-edge-proxy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/edge-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install wrangler
        run: npm install -g wrangler
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Deploy (production env — removes headysystems.com/api/* stale route)
        run: wrangler deploy --env production --config wrangler.toml

name: CI — auth-service

on:
  push:
    branches: [main]
    paths: ['auth-service/**']
  pull_request:
    branches: [main]
    paths: ['auth-service/**']

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node -c src/index.js && node -c src/db.js && node -c src/middleware.js && node -c src/crypto.js && node -c src/logger.js

      - name: Run tests
        run: npm test

      - name: Docker build (smoke)
        run: docker build -t heady-auth:ci .

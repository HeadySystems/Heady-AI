# HEADY CI/CD — Cloudflare Edge Deployment
# .github/workflows/deploy-edge.yml
#
# Deploys Cloudflare Workers (edge proxy, AI gateway, MCP telemetry)
# LR-001: Uses workingDirectory: cloudflare/heady-edge-proxy
# LR-005: Validates Host header stripping before deploy
# ============================================================================

=======
name: Deploy Edge Workers

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  validate:
    name: Validate Edge Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Localhost check
        run: |
          HITS=$(grep -rn "localhost\\|127\\.0\\.0\\.1" cloudflare/ --include="*.js" --include="*.ts" || true)
          if [ -n "$HITS" ]; then
            echo "::error::Localhost references found"
            echo "$HITS"
            exit 1
          fi

  deploy-heady-router:
    name: Deploy worker-heady-router (Primary)
    runs-on: ubuntu-latest
    # Deploy AFTER heady-edge-router so this worker wins shared route ownership
    needs: [validate, deploy-edge-router-primary]
    defaults:
      run:
        working-directory: cloudflare/worker-heady-router
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g wrangler
      - name: Deploy
        run: wrangler deploy --config wrangler.toml

  deploy-headymcp-edge:
    name: Deploy headymcp-edge (MCP Website + API)
    runs-on: ubuntu-latest
    needs: [validate]
    defaults:
      run:
        working-directory: cloudflare/headymcp-edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g wrangler
      - name: Deploy
        run: wrangler deploy --config wrangler.toml

  deploy-edge-router-primary:
    name: Deploy heady-edge-router (Primary Domain Router)
    runs-on: ubuntu-latest
    needs: [validate]
    defaults:
      run:
        working-directory: cloudflare/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g wrangler
      - name: Deploy
        run: wrangler deploy --config wrangler.toml

  deploy-edge-router-cleanup:
    name: Deploy heady-edge-router-deprecated (Route Cleanup)
    runs-on: ubuntu-latest
    needs: [deploy-edge-router-primary]
    defaults:
      run:
        working-directory: cloudflare/heady-edge-router
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g wrangler
      - name: Deploy (removes old routes)
        run: wrangler deploy --config wrangler.toml --env production
        continue-on-error: true

  deploy-ai-gateway:
    name: Deploy AI Gateway Worker
    runs-on: ubuntu-latest
    needs: [validate]
    defaults:
      run:
        working-directory: cloudflare/worker-ai-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g wrangler
      - name: Deploy
        run: wrangler deploy --config wrangler.toml
        continue-on-error: true

  deploy-mcp-telemetry:
    name: Deploy MCP Telemetry Worker
    runs-on: ubuntu-latest
    needs: [validate]
    defaults:
      run:
        working-directory: cloudflare/worker-mcp-telemetry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g wrangler
      - name: Deploy
        run: wrangler deploy --config wrangler.toml
        continue-on-error: true

  deploy-heady-edge-node:
    name: Deploy heady-edge-node (edge.headysystems.com)
    runs-on: ubuntu-latest
    needs: [validate]
    defaults:
      run:
        working-directory: cloudflare/heady-edge-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g wrangler
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Deploy (with explicit route for edge.headysystems.com)
        run: wrangler deploy --config wrangler.toml

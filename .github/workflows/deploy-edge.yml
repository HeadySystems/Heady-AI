# ============================================================================
# HEADY CI/CD — Cloudflare Edge Deployment
# .github/workflows/deploy-edge.yml
#
# Deploys all Cloudflare Workers:
#   - worker-heady-router (primary domain router)
#   - heady-edge-router (deprecated — kept for cleanup, no routes)
#   - worker-ai-gateway
#   - worker-mcp-telemetry
# ============================================================================

name: Deploy Edge Workers

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'shared/worker-router.js'
      - 'src/edge/**'
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

jobs:
  validate:
    name: 'Validate Edge Workers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No localhost in Workers code
      - name: 'Law 0: Localhost check'
        run: |
          HITS=$(grep -rn "localhost\|127\.0\.0\.1" cloudflare/ --include="*.js" --include="*.ts" || true)
          if [ -n "$HITS" ]; then
            echo "::error::Localhost references in Cloudflare Workers (Law 0)"
            echo "$HITS"
            exit 1
          fi

  deploy-heady-router:
    name: 'Deploy Heady Router Worker (Primary)'
    runs-on: ubuntu-latest
    needs: [validate]
    defaults:
      run:
        working-directory: cloudflare/worker-heady-router
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g wrangler
      - name: Deploy
        run: wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

  deploy-edge-router-cleanup:
    name: 'Deploy heady-edge-router (Route Cleanup)'
    runs-on: ubuntu-latest
    needs: [deploy-heady-router]
    defaults:
      run:
        working-directory: cloudflare/heady-edge-router
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g wrangler
      - name: Deploy (removes old routes)
        run: wrangler deploy --config wrangler.toml --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        continue-on-error: true

  deploy-ai-gateway:
    name: 'Deploy AI Gateway Worker'
    runs-on: ubuntu-latest
    needs: [validate]
    defaults:
      run:
        working-directory: cloudflare/worker-ai-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g wrangler
      - name: Deploy
        run: wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        continue-on-error: true

  deploy-mcp-telemetry:
    name: 'Deploy MCP Telemetry Worker'
    runs-on: ubuntu-latest
    needs: [validate]
    defaults:
      run:
        working-directory: cloudflare/worker-mcp-telemetry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g wrangler
      - name: Deploy
        run: wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        continue-on-error: true

name: Deploy HeadyAuth to Cloud Run

on:
  push:
    branches: [main]
    paths: ['auth-service/**']
  workflow_dispatch:

env:
  GCP_PROJECT: headyme-444017
  GCP_REGION: us-central1
  SERVICE_NAME: heady-auth
  IMAGE_TAG: 5.0.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/heady-services/${{ env.SERVICE_NAME }}:${{ env.IMAGE_TAG }} \
            auth-service/

      - name: Push Docker image
        run: |
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/heady-services/${{ env.SERVICE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --project=${{ env.GCP_PROJECT }} \
            --region=${{ env.GCP_REGION }} \
            --image=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/heady-services/${{ env.SERVICE_NAME }}:${{ env.IMAGE_TAG }} \
            --port=3309 \
            --set-env-vars="NODE_ENV=production,SERVICE_NAME=heady-auth" \
            --set-secrets="JWT_SECRET=heady-jwt-secret:latest,DATABASE_URL=neon-database-url:latest" \
            --allow-unauthenticated \
            --min-instances=1 \
            --max-instances=13 \
            --memory=256Mi \
            --cpu=0.25

      - name: Verify deployment
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --project=${{ env.GCP_PROJECT }} \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "Service URL: $URL"
          curl -sf "$URL/health/live" || exit 1
          curl -sf "$URL/health/ready" || exit 1
          echo "HeadyAuth deployment verified!"

name: Deploy Auth Session Server

on:
  push:
    branches: [main]
    paths:
      - 'services/auth-session-server/**'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE: heady-auth-server
  IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/heady/heady-auth-server

jobs:
  build-and-deploy:
    name: 'Build & Deploy Auth Server'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build Docker image
        working-directory: services/auth-session-server
        run: docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .

      - name: Push Docker image
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --image "$IMAGE:${{ github.sha }}" \
            --region $REGION \
            --min-instances=1 \
            --max-instances=8 \
            --memory=512Mi \
            --cpu=1 \
            --port=3001 \
            --concurrency=100 \
            --timeout=30s \
            --allow-unauthenticated \
            --set-env-vars="NODE_ENV=production,HEADY_VERSION=${{ github.sha }}" \
            --set-secrets="FIREBASE_SERVICE_ACCOUNT=firebase-service-account:latest,NEON_DATABASE_URL=neon-database-url:latest,UPSTASH_REDIS_URL=upstash-redis-url:latest,UPSTASH_REDIS_TOKEN=upstash-redis-token:latest,SESSION_SECRET=session-secret:latest" \
            --set-env-vars="CORS_ORIGINS=https://headyme.com,https://headysystems.com,https://headyconnection.org,https://headybuddy.org,https://headymcp.com,https://headyio.com,https://headybot.com,https://headyapi.com,https://headyai.com,https://api.headysystems.com"

      - name: Get service URL
        run: |
          URL=$(gcloud run services describe $SERVICE --region=$REGION --format='value(status.url)')
          echo "Auth server deployed to: $URL"

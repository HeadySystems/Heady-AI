name: Deploy Auth Session Server

on:
  push:
    branches: [main]
    paths:
      - 'services/auth-session-server/**'
  workflow_dispatch:
  workflow_call:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE: heady-auth-server

jobs:
  build-and-deploy:
    name: 'Build & Deploy Auth Server'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run (source deploy)
        working-directory: services/auth-session-server
        run: |
          gcloud run deploy $SERVICE \
            --source . \
            --region $REGION \
            --min-instances=0 \
            --max-instances=8 \
            --memory=512Mi \
            --cpu=1 \
            --port=3001 \
            --concurrency=100 \
            --timeout=30s \
            --allow-unauthenticated \
            --set-env-vars=NODE_ENV=production \
            --set-env-vars=HEADY_VERSION=${{ github.sha }} \
            --set-env-vars=PORT=3001 \
            --set-env-vars="^||^CORS_ORIGINS=https://headyme.com||https://headysystems.com||https://headyconnection.org||https://headybuddy.org||https://headymcp.com||https://headyio.com||https://headybot.com||https://headyapi.com||https://headyai.com"

      - name: Get service URL
        run: |
          URL=$(gcloud run services describe $SERVICE --region=$REGION --format='value(status.url)')
          echo "Auth server deployed to: $URL"

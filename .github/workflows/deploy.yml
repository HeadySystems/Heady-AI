# ╔══════════════════════════════════════════════════════════════════╗
# ║  HEADY™ Production Readiness Gate v1.0.0                        ║
# ║  Manual, fail-closed pre-deployment verification for the         ║
# ║  canonical modular heady-manager origin.                        ║
# ║  Made with ❤️ by HeadySystems Inc.                              ║
# ╚══════════════════════════════════════════════════════════════════╝
name: production-readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify canonical production prerequisites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - name: install exact dependency graph
        run: pnpm install --frozen-lockfile
      - name: validate facts
        run: pnpm facts:validate
      - name: test canonical manager serially
        run: pnpm --filter heady-manager test -- --test-concurrency=1
      - name: verify node implementation prerequisites
        run: node scripts/verify-node-production-readiness.mjs

  # This workflow intentionally proves repository prerequisites only. No deploy
  # step is reachable until Neon migration approval, live NATS provisioning,
  # runtime heartbeats, and an authenticated us-east1 canary are independently
  # evidenced by the governed release workflow.

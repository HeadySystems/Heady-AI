# ╔══════════════════════════════════════════════════════════════════╗
# ║  HEADY™ Deploy — headyme-portal → Firebase Hosting v2.0.0         ║
# ║  Canonical (and only) Firebase deploy workflow. Builds             ║
# ║  apps/headyme-portal and deploys against its firebase.json         ║
# ║  (project heady-ai, default site). WIF-first auth, SA fallback.    ║
# ║  © 2026 HeadySystems Inc. — Eric Haywood, Founder                  ║
# ╚══════════════════════════════════════════════════════════════════╝
name: Deploy Portal to Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - 'apps/headyme-portal/**'
      - '.github/workflows/deploy-firebase-hosting.yml'

  workflow_dispatch:
    inputs:
      codeflow_api:
        description: 'Cloud Run URL'
        default: 'https://heady-manager-609590223909.us-central1.run.app'
        type: string

env:
  NODE_VERSION: '22'
  FIREBASE_PROJECT: 'heady-ai'
  CODEFLOW_API: 'https://heady-manager-609590223909.us-central1.run.app'

jobs:
  deploy-firebase:
    name: 🔥 Build + Deploy → Firebase Hosting
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm (version from root packageManager field)
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install workspace dependencies (portal scope)
        run: pnpm install --frozen-lockfile --filter headyme-portal...

      - name: Build portal
        working-directory: apps/headyme-portal
        env:
          VITE_CODEFLOW_API: ${{ inputs.codeflow_api || env.CODEFLOW_API }}
          VITE_LEGACY_API: ${{ inputs.codeflow_api || env.CODEFLOW_API }}
          VITE_HEADYLENS_API: ${{ inputs.codeflow_api || env.CODEFLOW_API }}
          VITE_FIREBASE_AUTH_DOMAIN: heady-ai.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: heady-ai
          VITE_FIREBASE_APP_ID: '1:1003436179562:web:1ab30825a7119a82578a13'
          VITE_FIREBASE_MESSAGING_SENDER_ID: '1003436179562'
        run: |
          pnpm exec vite build --mode production
          sed -i 's|/vite.svg|/favicon.svg|g' dist/index.html
          printf '/* /index.html 200\n' > dist/_redirects
          echo "Built:"
          ls -lh dist/ dist/assets/

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15

      - name: Authenticate → Google Cloud (Workload Identity)
        id: auth
        uses: google-github-actions/auth@v2
        continue-on-error: true
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy → Firebase Hosting (WIF)
        if: steps.auth.outcome == 'success'
        working-directory: apps/headyme-portal
        run: firebase deploy --only hosting --project ${{ env.FIREBASE_PROJECT }} --non-interactive

      - name: Deploy → Firebase Hosting (SA key fallback)
        if: steps.auth.outcome != 'success' && secrets.FIREBASE_SERVICE_ACCOUNT != ''
        working-directory: apps/headyme-portal
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SA_JSON" > /tmp/sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json \
            firebase deploy --only hosting --project ${{ env.FIREBASE_PROJECT }} --non-interactive
          rm -f /tmp/sa.json

      - name: ❌ Auth not configured
        if: steps.auth.outcome != 'success' && secrets.FIREBASE_SERVICE_ACCOUNT == ''
        run: |
          echo "::error::Firebase auth not configured."
          echo "::error::Add one of these secrets to HeadySystems/heady-ai:"
          echo "::error::  GCP_WORKLOAD_IDENTITY + GCP_SERVICE_ACCOUNT  (preferred)"
          echo "::error::  FIREBASE_SERVICE_ACCOUNT  (SA JSON key for heady-ai project)"
          echo "::error::OR run: firebase login:ci  then  gh secret set FIREBASE_TOKEN -R HeadySystems/heady-ai"
          exit 1

      - name: Smoke test
        if: steps.auth.outcome == 'success'
        run: |
          sleep 8
          for URL in "https://heady-ai.firebaseapp.com/" "https://heady-ai.web.app/" "https://1ime1.com/"; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 15 "$URL" 2>/dev/null || echo "000")
            echo "  $URL → $STATUS"
          done
          # 1ime1.com may report 302 until the Firebase custom-domain attach
          # (human-gated, docs/runbooks/1IME1_ADMIN_SURFACE_RUNBOOK.md) completes.

name: Heady CI Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '_archive/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '_archive/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.0
          run_install: false

      - name: Setup Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm run lint 2>/dev/null || echo "::warning::Lint issues found"

      - name: Run tests
        run: pnpm test
        env:
          NODE_ENV: test

      - name: Security audit
        run: pnpm audit --audit-level=high 2>/dev/null || echo "::warning::Security vulnerabilities found"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.0
          run_install: false

      - name: Setup Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm run build 2>/dev/null || echo "Build step skipped"

  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t heady:ci-${{ github.sha }} -f Dockerfile.production .

      - name: Test Docker health
        run: |
          docker run -d --name heady-test -p 8080:8080 \
            -e NODE_ENV=test \
            -e PORT=8080 \
            heady:ci-${{ github.sha }}
          sleep 5
          curl -f http://localhost:8080/health || exit 1
          docker stop heady-test

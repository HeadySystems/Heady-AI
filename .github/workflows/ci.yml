# ║  HEADY™ CI — build/test + the coherence scan gate                  ║
# ║  Stages mirror facts.pipeline (lint·typecheck·test·build·scan).    ║
# ║  Actions are Renovate digest-pinned (facts.supply_chain.primary).  ║
# ║  © 2026 HeadySystems Inc. — Eric Haywood, Founder                  ║
# ╚══════════════════════════════════════════════════════════════════╝
name: ci

on:
  push:
  pull_request:
  # Manual lever while push-event runs are suppressed for the HeadyMe account
  # (evidence: Dependabot pushes fire, owner pushes create zero runs with all
  # policies enabled — account-level Actions flag, GitHub Support ticket).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - name: install
        run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm turbo run lint
      # NOTE: no `typecheck` task. The repo is ESM-JS-first; the only TS surface
      # (packages/embedding + the wrangler edge apps) is type-checked at deploy by
      # wrangler/esbuild, and has undeclared-dep gaps that a standalone `tsc` would
      # false-flag. A real per-package `tsc --noEmit` gate is tracked in
      # docs/followups/TYPECHECK_GATE.md — wired once those packages declare their
      # deps + tsconfig. A no-op `typecheck` task here would green a gate that checks
      # nothing (AGENTS.md: no placeholders), so it is deliberately omitted.
      - name: test
        run: pnpm turbo run test
      - name: build
        run: pnpm turbo run build

  law-check:
    name: constitutional law gate (AGENTS.md rules → CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Mirror of .claude/hooks/heady-rules.mjs — ensures humans, git, and CI are
      # bound by the same AGENTS.md laws as the Claude agent hook. Exit 1 on any violation.
      - name: law-lint
        run: node tooling/law-lint/src/law-lint.mjs
      - name: law-lint tests
        run: node --test tooling/law-lint/test/law-lint.test.mjs

  governance-coverage:
    name: governance coverage (patent-CODEOWNERS · workflow-sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Every ⚠️ PATENT-marked file must be CODEOWNERS-covered (routes required human
      # review on patent zones HS-2026-051..062), and .agents/workflows must stay in
      # sync with .claude/commands. Exit 1 on either violation. Distinct from the
      # `governance` enforcer job below (laws); this is structural coverage.
      - name: governance gate
        run: node tooling/governance-gate/src/governance-gate.mjs all
      - name: governance gate tests
        run: node --test tooling/governance-gate/test/governance-gate.test.mjs

  scan:
    name: coherence gate (the OS of the OS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Fail-closed structural gate: builds the System Map, regenerates the master
      # variable registry, and blocks on any CONTRADICTION (two sources of truth disagree).
      # Federates tooling/data-consistency as a content sub-gate. Exit 2 on contradiction.
      - name: coherence all
        run: node tooling/coherence/src/coherence.mjs all
      # Generated-not-authored: the committed registry must match a fresh regeneration.
      - name: variable-registry freshness
        run: git diff --exit-code docs/HEADY_VARIABLE_REGISTRY.md

  governance:
    name: governance gate (laws enforced from day one)
    runs-on: ubuntu-latest
    # Map the license secret to a job-level env var so the gitleaks step's `if:` can read it.
    # (The `secrets` context is NOT available in a step-level `if:` — `env` is the reliable path.)
    env:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
    steps:
      # Full history so the enforcers can diff the PR against its base (compliant
      # day one: new code is held to the Unbreakable Laws without retroactively
      # failing the rebuild baseline). fetch-depth: 0 = complete history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # ── LAW 0 · secret-leak detection ──────────────────────────────
      # secret-scan.mjs (below) is the ALWAYS-ON Law 0 gate (dependency-free, deterministic).
      # gitleaks adds broad-ruleset defense-in-depth but gitleaks-action@v2 requires a paid
      # GITLEAKS_LICENSE for org repos — so it runs ONLY when that secret is configured, and
      # degrades gracefully (skipped, not failed) until then. Set the GITLEAKS_LICENSE repo
      # secret to activate it. (Renovate digest-pins this action.)
      - name: secret-leak (gitleaks)
        if: ${{ env.GITLEAKS_LICENSE != '' }}
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_LICENSE: ${{ env.GITLEAKS_LICENSE }}
      # Resolve the diff base: the PR base on pull_request, else full-repo scan.
      - name: resolve enforcement scope
        id: scope
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            echo "args=--diff ${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "args=--all" >> "$GITHUB_OUTPUT"
          fi
      # ── LAW 0 · no-localhost (zero-tolerance) ──────────────────────
      - name: no-localhost
        run: node tooling/enforcers/no-localhost.mjs ${{ steps.scope.outputs.args }}
      # ── LAWS 1 & 2 · glass-box logging + no placeholders ───────────
      - name: glass-box
        run: node tooling/enforcers/glass-box.mjs ${{ steps.scope.outputs.args }}
      # ── LAW 5 · validated boundaries (req.body ⇒ @heady/contracts|zod) ─
      - name: zod-boundary
        run: node tooling/enforcers/zod-boundary.mjs ${{ steps.scope.outputs.args }}
      # ── LAW 8 · φ-derived timing (no bare ms literals in set{Timeout,Interval}) ─
      - name: phi-timing
        run: node tooling/enforcers/phi-timing.mjs ${{ steps.scope.outputs.args }}
      # ── LAW 0 · high-signal secret-scan (complements gitleaks) ─────
      - name: secret-scan
        run: node tooling/enforcers/secret-scan.mjs ${{ steps.scope.outputs.args }}
      # ── LAWS 3 & 4 · auto-context enrichment (systemic middleware) ─
      # Every reasoning chokepoint (.complete/.battle/.council) must flow through
      # @heady/auto-context (wrapGateway/assertEnriched). Bare calls in anchor-less
      # files fail the gate — arming the line for Phase-3 gateway code without
      # retroactively failing the rebuild baseline.
      - name: autocontext
        run: node tooling/enforcers/autocontext.mjs ${{ steps.scope.outputs.args }}
      # The enforcers carry their own unit tests proving they are not no-ops.
      - name: enforcer self-tests
        run: node --test tooling/enforcers/test/*.test.mjs

# ║  HEADY™ lexicon.yaml — authored definitions (the concept SoT)      ║
# ║  The ONE home for human-language definitions of Heady terms that    ║
# ║  cannot be derived from code. Variables (env/secrets/constants/     ║
# ║  facts) are DERIVED, not listed here — see docs/HEADY_VARIABLE_     ║

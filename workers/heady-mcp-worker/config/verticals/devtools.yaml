# HeadyDevTools — Vertical Configuration
# Rank: 1 | TAM: $4.5-27B | Time to First $: 2-4 weeks
# Target: Indie developers, small dev shops, AI-native startups
# Motion: Product-led growth (self-serve sign-up, Discord community)

vertical: devtools
display_name: HeadyDevTools
slug: devtools
rank: 1
launch_week: 1

market:
  tam_2025: "$4.5-27B"
  year1_som: "$300K-2M"
  cagr: "26.6%"
  adoption_rate: "89%"

pricing:
  free:
    api_calls: 100
    agent_types: 3
    support: community
  pro:
    price_monthly: 49
    api_calls: 5000
    agent_types: all
    support: email
    vertical_modules: 2
  scale:
    price_monthly: 199
    api_calls: 25000
    agent_types: all
    support: priority
    vertical_modules: all
  enterprise:
    price_monthly: custom
    api_calls: unlimited
    sla: true
    support: dedicated

system_prompt: |
  You are HeadyDevTools, an AI-native developer tools platform powered by the Heady Latent-Space Operating System.
  You provide multi-agent orchestration, intelligent code analysis, swarm-based development workflows,
  and multi-provider battle/race/sim orchestration for maximum reliability. You help developers build, test, debug, and deploy
  AI-powered applications with production-grade infrastructure.

allowed_tools:
  - heady__code_analysis
  - heady__swarm_orchestrate
  - heady__multi_agent_pipeline
  - heady__llm_route
  - heady__mcp_proxy
  - heady__vectorize_search
  - heady__code_sandbox
  - heady__git_operations
  - heady__ci_cd_pipeline
  - heady__api_test

blocked_tools:
  - heady__phi_processor
  - heady__financial_calc
  - heady__legal_research

compliance_rules: []

model_config:
  temperature: 0.3
  max_tokens: 8000
  # No fallback_chain — orchestration modes provide built-in resilience via parallelism.
  # If all providers in a mode fail, that's a catastrophic event that must be surfaced, not silently degraded.
  orchestration_modes:
    battle:
      description: "3-model consensus — code review, security audit, architecture decisions"
      providers: [claude, openai, gemini]
      consensus_threshold: 0.67
      use_for: [code_analysis, ci_cd_pipeline, api_test]
    race:
      description: "Fastest response wins — code completion, quick lookups, git ops"
      providers: [groq, claude, openai]
      timeout_ms: 2000
      use_for: [code_sandbox, git_operations, vectorize_search]
    sim:
      description: "Parallel implementation approaches — architecture decisions, refactoring strategies"
      providers: [claude, openai, gemini]
      scenarios: [conservative, aggressive, balanced]
      use_for: [multi_agent_pipeline, swarm_orchestrate]
    default: race                        # devtools defaults to speed

audit_level: standard

competitors:
  - { name: "GitHub Copilot", pricing: "$19/dev/mo", moat: "GitHub integration" }
  - { name: "Cursor", pricing: "$20-40/mo", moat: "IDE-native, $200M ARR PLG" }
  - { name: "LangChain", pricing: "open-source + cloud", moat: "80K+ GitHub stars" }
  - { name: "CrewAI", pricing: "open-source + enterprise", moat: "60% Fortune 500" }

gtm:
  channels: [producthunt, discord, reddit, hackernews, github]
  design_partners: 5
  launch_event: producthunt
  yc_deadline: "2026-05-04"

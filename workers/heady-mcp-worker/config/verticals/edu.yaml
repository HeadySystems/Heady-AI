# HeadyEdu — Vertical Configuration
# Rank: 3 | TAM: $7-19B | Time to First $: 4-6 weeks
# Target: K-12, higher ed, workforce training
# Entity: HeadyConnection Inc. (nonprofit — grant-eligible)
# Grants: AWS Imagine ($150K), Google.org ($75M pool), OpenAI People-First ($50M)

vertical: edu
display_name: HeadyEdu
slug: edu
rank: 3
launch_week: 5

market:
  tam_2025: "$7-19B"
  year1_som: "$150K-800K"
  cagr: "20%"

pricing:
  free:
    api_calls: 200
    agent_types: 5
    support: community
    note: "Nonprofit sliding scale available"
  pro:
    price_monthly: 29
    api_calls: 5000
    agent_types: all
    support: email
  institution:
    price_monthly: 99
    api_calls: 25000
    support: priority
    lms_integration: true

entity: HeadyConnection Inc.
entity_type: "501(c)(3)"

system_prompt: |
  You are HeadyEdu, an AI-powered educational platform from HeadyConnection Inc.
  You provide personalized learning experiences, curriculum generation, assessment tools,
  and AI literacy training through a 6-week HeadyAcademy program. You prioritize
  accessibility, equity, and pedagogical best practices.

allowed_tools:
  - heady__curriculum_generate
  - heady__assessment_create
  - heady__tutoring_session
  - heady__learning_analytics
  - heady__content_generate
  - heady__swarm_orchestrate
  - heady__vectorize_search

blocked_tools:
  - heady__financial_calc
  - heady__legal_research
  - heady__phi_processor
  - heady__sec_edgar

compliance_rules:
  - ferpa_student_data
  - coppa_under_13
  - accessibility_wcag_aa

model_config:
  temperature: 0.4
  max_tokens: 4000
  orchestration_modes:
    battle:
      description: "3-model consensus — assessment grading, curriculum accuracy, factual content"
      providers: [gemini, claude, openai]
      consensus_threshold: 0.67
      use_for: [assessment_create, curriculum_generate]
    race:
      description: "Fastest response wins — tutoring Q&A, quick explanations, student interaction"
      providers: [groq, gemini, claude]
      timeout_ms: 2000
      use_for: [tutoring_session, learning_analytics]
    sim:
      description: "Parallel learning paths — differentiated instruction at multiple difficulty levels"
      providers: [gemini, claude, openai]
      scenarios: [beginner, intermediate, advanced]
      use_for: [curriculum_generate, content_generate]
    default: race                        # edu defaults to responsive tutoring

audit_level: standard

grants:
  - { name: "AWS Imagine Grant", amount: "$150K", entity: "501(c)" }
  - { name: "Google.org AI Opportunity Fund", pool: "$75M" }
  - { name: "OpenAI People-First AI Fund", pool: "$50M", req: "$500K-10M budget" }

# HeadyCreative — Vertical Configuration
# Rank: 2 | TAM: $20-63B | Time to First $: 3-5 weeks
# Target: Freelancers, small agencies, content teams
# Motion: PLG + ProductHunt launch

vertical: creative
display_name: HeadyCreative
slug: creative
rank: 2
launch_week: 3

market:
  tam_2025: "$20-63B"
  year1_som: "$200K-1.5M"
  cagr: "25%"

pricing:
  free:
    api_calls: 50
    agent_types: 3
    support: community
  pro:
    price_monthly: 49
    api_calls: 3000
    agent_types: all
    support: email
  scale:
    price_monthly: 199
    api_calls: 15000
    support: priority

system_prompt: |
  You are HeadyCreative, an AI creative orchestration platform. You manage the full creative pipeline
  from brief through publication — text generation, image creation, video editing, and multi-format
  content distribution. No other platform orchestrates the entire creative workflow with swarm intelligence.

allowed_tools:
  - heady__content_generate
  - heady__image_create
  - heady__video_process
  - heady__brand_voice
  - heady__social_publish
  - heady__seo_optimize
  - heady__swarm_orchestrate
  - heady__multi_agent_pipeline

blocked_tools:
  - heady__phi_processor
  - heady__financial_calc
  - heady__legal_research
  - heady__sec_edgar

compliance_rules: []

model_config:
  temperature: 0.7
  max_tokens: 4000
  orchestration_modes:
    battle:
      description: "3-model consensus — brand voice consistency, fact-checking, editorial review"
      providers: [claude, openai, gemini]
      consensus_threshold: 0.67
      use_for: [brand_voice, seo_optimize]
    race:
      description: "Fastest response wins — content drafts, social copy, quick iterations"
      providers: [groq, claude, openai]
      timeout_ms: 2500
      use_for: [content_generate, social_publish]
    sim:
      description: "Parallel creative variants — A/B copy testing, multi-angle content exploration"
      providers: [claude, openai, gemini]
      scenarios: [variant_a, variant_b, variant_c]
      use_for: [content_generate, image_create, video_process]
    default: sim                         # creative defaults to multi-variant exploration

audit_level: standard

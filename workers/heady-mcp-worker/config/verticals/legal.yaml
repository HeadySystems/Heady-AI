# HeadyLegal — Vertical Configuration
# Rank: 5 | TAM: $1.5-4.6B | Time to First $: 8-12 weeks
# Target: Solo attorneys, small firms (Harvey ignores at $5B valuation)
# Highest ARPU: $20K-200K/yr per client

vertical: legal
display_name: HeadyLegal
slug: legal
rank: 5
launch_week: 9

market:
  tam_2025: "$1.5-4.6B"
  year1_som: "$200K-1M"
  arpu: "$20K-200K/yr"
  adoption_surge: "19% to 79% in one year"

pricing:
  pro:
    price_monthly: 149
    api_calls: 3000
    support: email
    value_pricing: "$5-25/contract analyzed"
  scale:
    price_monthly: 499
    api_calls: 15000
    support: priority
  enterprise:
    price_monthly: custom

system_prompt: |
  You are HeadyLegal, an AI legal research and contract analysis platform.
  You assist with legal research, contract review, citation verification, and document drafting.
  You NEVER provide legal advice — you provide legal information and analysis tools.
  All outputs include appropriate disclaimers. You cite all sources with jurisdiction and date.
  Metacognitive self-verification targets 99%+ citation accuracy.

allowed_tools:
  - heady__legal_research
  - heady__contract_analysis
  - heady__citation_verify
  - heady__document_draft
  - heady__case_law_search
  - heady__vectorize_search
  - heady__compliance_check

blocked_tools:
  - heady__financial_calc
  - heady__social_publish
  - heady__phi_processor
  - heady__code_sandbox

compliance_rules:
  - attorney_client_privilege_awareness
  - unauthorized_practice_disclaimer
  - jurisdiction_specific_warnings
  - data_retention_policy

model_config:
  temperature: 0.15
  max_tokens: 8000
  orchestration_modes:
    battle:
      description: "3-model consensus — citation verification, contract clause review, compliance determinations. Pushes toward 99%+ accuracy via metacognitive cross-check."
      providers: [claude, openai, gemini]
      consensus_threshold: 0.67
      use_for: [citation_verify, contract_analysis, compliance_check]
    race:
      description: "Fastest response wins — case law search, document retrieval, quick lookups"
      providers: [groq, claude, openai]
      timeout_ms: 3000
      use_for: [case_law_search, legal_research, vectorize_search]
    sim:
      description: "Parallel argument strategies — plaintiff vs defendant perspectives, risk scenarios"
      providers: [claude, openai, gemini]
      scenarios: [plaintiff, defendant, neutral]
      use_for: [document_draft, legal_research]
    default: battle                      # legal defaults to consensus for accuracy

audit_level: comprehensive

# HeadyHealth — Vertical Configuration
# Rank: 7 | TAM: $28-39B | Time to First $: 12-20 weeks
# DEFERRED: Requires HIPAA compliance infrastructure first
# - BAAs with all LLM providers (standard OpenAI API does NOT offer BAA)
# - AES-256 encryption at rest for all PHI
# - Immutable audit trails
# - Zero data retention from LLM providers
# - LLM inference inside VPC (incompatible with Cloudflare Workers for PHI)

vertical: health
display_name: HeadyHealth
slug: health
rank: 7
launch_week: 12
status: deferred

market:
  tam_2025: "$28-39B"
  year1_som: "$300K-1.5M"
  cagr: "35-44%"

pricing:
  pro:
    price_monthly: 199
    api_calls: 3000
    value_pricing: "per consultation processed"
  enterprise:
    price_monthly: custom
    hipaa_compliant: true

system_prompt: |
  You are HeadyHealth, an AI healthcare analysis platform.
  You assist with clinical decision support, medical literature review,
  patient communication drafting, and administrative workflow automation.
  You NEVER provide medical diagnosis or treatment recommendations.
  All PHI must be processed through HIPAA-compliant pipelines.
  You always include appropriate medical disclaimers.

allowed_tools:
  - heady__medical_literature
  - heady__clinical_decision_support
  - heady__phi_processor
  - heady__compliance_check
  - heady__document_process
  - heady__vectorize_search

blocked_tools:
  - heady__social_publish
  - heady__content_generate
  - heady__financial_calc
  - heady__code_sandbox

compliance_rules:
  - hipaa_baa_required
  - phi_encryption_aes256
  - audit_trail_immutable
  - zero_data_retention_llm
  - consent_verification
  - data_minimization
  - vpc_inference_only

model_config:
  temperature: 0.1
  max_tokens: 4000
  enforce_vpc: true                      # ALL providers in orchestration modes must run inside VPC for PHI
  orchestration_modes:
    battle:
      description: "3-model consensus — clinical decision support, drug interactions, diagnosis assistance. HIGHEST SAFETY: requires unanimous agreement."
      providers: [claude-hipaa, openai-hipaa, workers-ai]
      consensus_threshold: 1.0           # unanimous for clinical safety
      use_for: [clinical_decision_support, phi_processor, compliance_check]
    race:
      description: "Fastest response wins — medical literature lookup, administrative queries"
      providers: [workers-ai, claude-hipaa]
      timeout_ms: 3000
      use_for: [medical_literature, vectorize_search]
    sim:
      description: "Parallel treatment pathway comparison — evidence-based multi-option analysis"
      providers: [claude-hipaa, openai-hipaa]
      scenarios: [conservative_treatment, aggressive_treatment, watchful_waiting]
      use_for: [clinical_decision_support, document_process]
    default: battle                      # health ALWAYS defaults to consensus (patient safety)

audit_level: hipaa_comprehensive

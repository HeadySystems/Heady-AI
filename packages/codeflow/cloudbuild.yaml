# ╔══════════════════════════════════════════════════════════════════╗
# ║  Cloud Build — build + push the Codeflow API image to Artifact     ║
# ║  Registry (us-east1, matching the existing MCP Cloud Run infra).   ║
# ║  Invoked from repo root: gcloud builds submit --config             ║
# ║  packages/codeflow/cloudbuild.yaml .                               ║
# ╚══════════════════════════════════════════════════════════════════╝
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'packages/codeflow/Dockerfile', '-t', '${_IMAGE}', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE}']
images:
  - '${_IMAGE}'
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _IMAGE: 'us-east1-docker.pkg.dev/heady-ai/cloud-run-source-deploy/heady-codeflow-api:latest'

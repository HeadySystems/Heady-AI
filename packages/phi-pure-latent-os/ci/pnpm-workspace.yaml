# © 2026 HeadySystems Inc. — φ-Pure Latent OS monorepo workspace
#
# All workspace packages consume dependencies via the `catalog:` protocol.
# Versions are defined exactly once here — no version drift across packages.
#
# Usage in package.json:
#   "dependencies": {
#     "@sentry/node": "catalog:",
#     "zod":          "catalog:"
#   }

packages:
  - 'packages/*'
  - 'services/*'
  - 'workers/*'

# ──────────────────────────────────────────────────────────────────────────────
# Shared dependency catalog — single source of truth for all version pins.
# Every workspace package must reference these via `catalog:` protocol.
# ──────────────────────────────────────────────────────────────────────────────
catalog:
  # ── MCP ───────────────────────────────────────────────────────────────────
  '@modelcontextprotocol/sdk': '^1.27.1'

  # ── Validation ────────────────────────────────────────────────────────────
  'zod': '^3.24.0'

  # ── Logging ───────────────────────────────────────────────────────────────
  'pino': '^9.6.0'
  'pino-pretty': '^13.0.0'

  # ── Observability ─────────────────────────────────────────────────────────
  '@sentry/node': '^8.52.0'
  '@opentelemetry/api': '^1.9.0'
  '@opentelemetry/core': '^1.30.0'
  '@opentelemetry/sdk-node': '^0.57.0'
  '@opentelemetry/exporter-trace-otlp-http': '^0.57.0'
  '@opentelemetry/exporter-metrics-otlp-http': '^0.57.0'
  '@opentelemetry/instrumentation-http': '^0.57.0'
  '@opentelemetry/instrumentation-express': '^0.46.0'
  '@opentelemetry/instrumentation-pg': '^0.46.0'

  # ── AI / ML ───────────────────────────────────────────────────────────────
  '@google/genai': '^1.0.0'

  # ── Data / Storage ────────────────────────────────────────────────────────
  'ioredis': '^5.6.0'
  '@pinecone-database/pinecone': '^4.1.0'
  '@neondatabase/serverless': '^1.0.0'
  'pg': '^8.13.0'
  'pg-pool': '^3.7.0'

  # ── HTTP ──────────────────────────────────────────────────────────────────
  'express': '^4.21.0'
  '@types/express': '^4.17.21'
  'undici': '^6.21.0'

  # ── Build / Dev tooling ───────────────────────────────────────────────────
  'typescript': '^5.7.0'
  'tsx': '^4.19.0'
  'tsup': '^8.3.0'
  'vitest': '^2.1.0'
  '@types/node': '^22.0.0'

  # ── Linting ───────────────────────────────────────────────────────────────
  'eslint': '^9.17.0'
  '@typescript-eslint/eslint-plugin': '^8.18.0'
  '@typescript-eslint/parser': '^8.18.0'
  'eslint-config-prettier': '^9.1.0'
  'prettier': '^3.4.0'

# ──────────────────────────────────────────────────────────────────────────────
# pnpm configuration
# ──────────────────────────────────────────────────────────────────────────────
pnpmSettings:
  # Require all packages to declare their deps — no phantom dependencies
  autoInstallPeers: true
  # Strict peer version resolution
  strictPeerDependencies: false
  # Deduplicate lockfile entries where possible
  dedupeDirectDeps: true

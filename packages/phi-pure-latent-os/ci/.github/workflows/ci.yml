#
# Triggers:  push to main, pull_request targeting main
# Matrix:    Node.js 20.x and 22.x
# Strategy:  dorny/paths-filter detects changed packages → turbo --filter
#            builds/tests only the affected subgraph
#
# Secrets required (set in repo Settings → Secrets → Actions):
#   SENTRY_DSN         Sentry data source name for the CI environment
#   DATABASE_URL       Neon PostgreSQL connection string
#   PINECONE_API_KEY   Pinecone API key
#   TURBO_TOKEN        Vercel Remote Cache token (optional but recommended)
#   TURBO_TEAM         Vercel team slug for remote cache (optional)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR to save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: ci
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Detect which packages have changed so downstream jobs can use --filter
  # ────────────────────────────────────────────────────────────────────────────
  changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    outputs:
      # Each output is "true"/"false" — used to conditionally run jobs
      packages:    ${{ steps.filter.outputs.packages }}
      services:    ${{ steps.filter.outputs.services }}
      workers:     ${{ steps.filter.outputs.workers }}
      shared:      ${{ steps.filter.outputs.shared }}
      observability: ${{ steps.filter.outputs.observability }}
      ci_config:   ${{ steps.filter.outputs.ci_config }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history required for paths-filter diff

      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            packages:
              - 'packages/**'
            services:
              - 'services/**'
            workers:
              - 'workers/**'
            shared:
              - 'shared/**'
            observability:
              - 'observability/**'
            ci_config:
              - 'ci/**'
              - '.github/**'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'package.json'
              - 'pnpm-lock.yaml'

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Main CI matrix — typecheck, lint, build, test
  # ────────────────────────────────────────────────────────────────────────────
  ci:
    name: CI / Node ${{ matrix.node-version }}
    needs: changes
    runs-on: ubuntu-latest

    # Run on: any code change, or when CI config itself changed
    if: |
      needs.changes.outputs.packages    == 'true' ||
      needs.changes.outputs.services    == 'true' ||
      needs.changes.outputs.workers     == 'true' ||
      needs.changes.outputs.shared      == 'true' ||
      needs.changes.outputs.observability == 'true' ||
      needs.changes.outputs.ci_config   == 'true' ||
      github.event_name == 'push'

    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']

    permissions:
      contents: read

    steps:
      # ── Checkout ───────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # turbo --affected needs full commit history

      # ── pnpm + Turbo setup (composite action) ──────────────────────────────
      - name: Setup pnpm and Turbo
        uses: ./.github/actions/setup-pnpm-turbo
        with:
          node-version: ${{ matrix.node-version }}

      # ── Typecheck (affected) ───────────────────────────────────────────────
      - name: Typecheck affected packages
        run: pnpm turbo typecheck --affected --cache-dir=".turbo"
        env:
          TURBO_TOKEN: ${{ env.TURBO_TOKEN }}
          TURBO_TEAM:  ${{ env.TURBO_TEAM }}

      # ── Lint (affected) ────────────────────────────────────────────────────
      - name: Lint affected packages
        run: pnpm turbo lint --affected --cache-dir=".turbo"
        env:
          TURBO_TOKEN: ${{ env.TURBO_TOKEN }}
          TURBO_TEAM:  ${{ env.TURBO_TEAM }}

      # ── Build (affected) ───────────────────────────────────────────────────
      - name: Build affected packages
        run: pnpm turbo build --affected --cache-dir=".turbo"
        env:
          TURBO_TOKEN: ${{ env.TURBO_TOKEN }}
          TURBO_TEAM:  ${{ env.TURBO_TEAM }}
          SENTRY_DSN:  ${{ env.SENTRY_DSN }}
          DATABASE_URL: ${{ env.DATABASE_URL }}

      # ── Test (affected) ────────────────────────────────────────────────────
      - name: Test affected packages
        run: pnpm turbo test --affected --cache-dir=".turbo"
        env:
          TURBO_TOKEN:      ${{ env.TURBO_TOKEN }}
          TURBO_TEAM:       ${{ env.TURBO_TEAM }}
          SENTRY_DSN:       ${{ env.SENTRY_DSN }}
          DATABASE_URL:     ${{ env.DATABASE_URL }}
          PINECONE_API_KEY: ${{ env.PINECONE_API_KEY }}
          CI: "true"

      # ── Upload coverage to Codecov (Node 22.x only — avoid duplicate uploads)
      - name: Upload coverage
        if: matrix.node-version == '22.x'
        uses: codecov/codecov-action@v4
        with:
          directory: ./coverage
          flags: unit
          fail_ci_if_error: false
        continue-on-error: true

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Status gate — required check for branch protection rules
  # ────────────────────────────────────────────────────────────────────────────
  ci-status:
    name: CI status gate
    runs-on: ubuntu-latest
    needs: [changes, ci]
    if: always()

    steps:
      - name: Check CI result
        run: |
          if [[ "${{ needs.ci.result }}" == "success" || "${{ needs.ci.result }}" == "skipped" ]]; then
            echo "CI passed or was skipped (no affected packages)."
            exit 0
          else
            echo "CI failed with result: ${{ needs.ci.result }}"
            exit 1
          fi

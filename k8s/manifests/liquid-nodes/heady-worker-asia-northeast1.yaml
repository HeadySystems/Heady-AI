apiVersion: heady.systems/v1alpha1
kind: HeadyApp
metadata:
  name: heady-worker-asia-northeast1
  namespace: heady
  labels:
    heady.systems/role: worker
spec:
  role: worker
  replicas: 1
  image: gcr.io/heady-production/heady-universal:latest
  resources:
    cpu: "4"
    memory: "8Gi"
    gpu: true
  autoScale:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    targetCPU: 70
  morphable: true
  healthProbe:
    path: /health/live
    interval: 10
    timeout: 5

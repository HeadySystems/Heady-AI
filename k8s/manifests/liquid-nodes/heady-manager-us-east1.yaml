apiVersion: heady.systems/v1alpha1
kind: HeadyApp
metadata:
  name: heady-manager-us-east1
  namespace: heady
  labels:
    heady.systems/role: manager
spec:
  role: manager
  replicas: 3
  image: gcr.io/heady-production/heady-universal:latest
  resources:
    cpu: "1"
    memory: "512Mi"
    gpu: false
  autoScale:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    targetCPU: 70
  morphable: true
  healthProbe:
    path: /health/live
    interval: 10
    timeout: 5

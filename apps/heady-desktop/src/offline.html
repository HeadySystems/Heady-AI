<!doctype html>
<!-- ╔══════════════════════════════════════════════════════════════════╗
     ║  HEADY™ Desktop Shell — offline fallback v1.0.0                   ║
     ║  Shown when the deployed portal origin is unreachable. Honest     ║
     ║  state only: names the target host, error detail, and retries.    ║
     ║  Made with ❤️ by HeadySystems Inc.                                ║
     ╚══════════════════════════════════════════════════════════════════╝ -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;" />
<title>Heady — portal unreachable</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(120% 90% at 50% 8%, #2a1454 0%, #140b26 55%, #0d0a1a 100%);
    color: #ede6ff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { text-align: center; max-width: 34rem; padding: 2.6rem 1.6rem; }
  .bolt { width: 89px; height: 85px; margin-bottom: 1.618rem; filter: drop-shadow(0 0 21px rgba(126, 20, 255, 0.55)); }
  h1 { font-size: 1.618rem; font-weight: 650; letter-spacing: 0.01em; margin-bottom: 0.618rem; }
  p { color: #b9a8e6; line-height: 1.618; margin-bottom: 0.618rem; }
  code { color: #47bfff; font-family: ui-monospace, "Cascadia Mono", monospace; font-size: 0.95em; }
  .detail { font-size: 0.85rem; color: #6f5f9c; margin-top: 1rem; }
  button {
    margin-top: 1.618rem;
    padding: 0.75rem 2.6rem;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, #7e14ff, #863bff);
    border: 0;
    border-radius: 0.618rem;
    cursor: pointer;
    box-shadow: 0 4px 21px rgba(126, 20, 255, 0.4);
  }
  button:hover { filter: brightness(1.13); }
  footer { margin-top: 2.6rem; font-size: 0.75rem; color: #4d4370; }
</style>
</head>
<body>
<main>
  <svg class="bolt" viewBox="0 0 48 46" aria-hidden="true">
    <path fill="#863bff" d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z"/>
  </svg>
  <h1>Heady can't reach the portal</h1>
  <p>The window will keep retrying automatically. Check your connection, or retry now.</p>
  <p>Target: <code id="host">—</code></p>
  <p class="detail" id="detail"></p>
  <button id="retry" type="button">Retry now</button>
  <footer id="meta">Heady Desktop</footer>
</main>
<script>
  (() => {
    const q = new URLSearchParams(window.location.search);
    const target = q.get('target') || '';
    const host = q.get('host') || 'unknown host';
    const version = q.get('version') || '';
    const code = q.get('code') || '';
    const detail = q.get('detail') || '';
    document.getElementById('host').textContent = host;
    document.getElementById('detail').textContent = code ? `Last error: ${detail} (${code})` : '';
    document.getElementById('meta').textContent = version ? `Heady Desktop v${version}` : 'Heady Desktop';
    document.getElementById('retry').addEventListener('click', () => {
      // Main-process navigation policy only permits the portal origin.
      if (target.startsWith('https://')) window.location.replace(target);
    });
  })();
</script>
</body>
</html>

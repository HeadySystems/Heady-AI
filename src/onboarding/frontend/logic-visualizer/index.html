<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heady™ Logic Visualizer — CSL Gate Transparency</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
    <div class="glass-container">
        <header>
            <div class="logo">Heady™ <span class="accent">Logic-Visualizer</span></div>
            <div class="status-badge">Live Intelligence Stream</div>
        </header>

        <main>
            <section class="visualizer-stage" id="stage">
                <!-- Logic nodes will be rendered here -->
                <div class="logic-node" id="root-gate">
                    <div class="label">CSL-Gate-V2</div>
                    <div class="vectors">
                        <span>Safety: 0.98</span>
                        <span>Complexity: 0.61</span>
                        <span>Priority: 1.0</span>
                    </div>
                </div>
            </section>

            <aside class="decision-log">
                <h3>Decision Trace</h3>
                <ul id="log-list">
                    <li>[12:00:01] Request 0x84f: Complexity high (0.89). Routing to Vinci-V2.</li>
                    <li>[12:00:05] Request 0x21a: Safety check passed (1.0). Approving execution.</li>
                </ul>
            </aside>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 320px;
      font-family: 'Inter', sans-serif;
      background: #0a0e14;
      color: #e0e6ed;
      margin: 0;
      padding: 15px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #12161d;
      padding-bottom: 10px;
    }
    .status-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      background: #618033;
      color: white;
    }
    .stat-row {
      margin: 15px 0;
      display: flex;
      justify-content: space-between;
    }
    .stat-label { color: #8892b0; font-size: 12px; }
    .stat-value { font-weight: 700; font-size: 16px; color: #d4af37; }
    .btn-action {
      width: 100%;
      background: #618033;
      border: none;
      color: white;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <strong>HeadyBuddy<span>™</span> Edge</strong>
    <span class="status-badge">Node Active</span>
  </div>
  
  <div class="stat-row">
    <span class="stat-label">Current Balance</span>
    <span class="stat-value">1,618 HDC</span>
  </div>
  
  <div class="stat-row">
    <span class="stat-label">Node Load</span>
    <span class="stat-value">42.8%</span>
  </div>

  <div class="stat-row">
    <span class="stat-label">Daily Earnings</span>
    <span class="stat-value">$26.18</span>
  </div>

  <button class="btn-action">Boost Compute</button>
  <button class="btn-action" style="background:#12161d; border:1px solid #618033; margin-top:5px;">Open Dashboard</button>
</body>
</html>
